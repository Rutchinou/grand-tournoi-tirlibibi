{% extends 'base.html' %}{% block content %}<div class="card narrow"><h1>Je rejoins le tournoi</h1><form method="post"><label>Prénom / pseudo<input name="name" maxlength="40" required></label><label>Email<input type="email" name="email" required></label><label>Mot de passe<input type="password" name="password" minlength="6" required></label><label>Choisis ton avatar</label><div class="avatars">{% for a in avatars %}<label class="avatar-choice"><input type="radio" name="avatar" value="{{a}}" {% if loop.first %}checked{% endif %}><span>{{a}}</span></label>{% endfor %}</div><button class="button">Créer mon compte</button></form></div>{% endblock %}
