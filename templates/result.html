{% extends 'base.html' %}{% block content %}<div class="card narrow"><p class="eyebrow">RÉSULTAT</p><h1>{{game.name}}</h1><p>Attribue une place de 1 à 5 à chacun des joueurs.</p><form method="post">{% for p in players %}<label>{{p.avatar}} {{p.name}}<select name="rank_{{p.id}}" required><option value="">Place</option>{% for n in range(1,6) %}<option value="{{n}}" {% if oldmap.get(p.id|string)==n %}selected{% endif %}>{{n}} — {% if n==1 %}5 points{% elif n==2 %}4 points{% elif n==3 %}3 points{% elif n==4 %}2 points{% else %}1 point{% endif %}</option>{% endfor %}</select></label>{% endfor %}<button class="button">Enregistrer le résultat</button></form></div>{% endblock %}
